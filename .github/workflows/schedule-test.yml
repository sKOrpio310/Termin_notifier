name: Schedule test (dummy)

# Diagnostic only: confirms whether GitHub is servicing this repo's cron schedules at all,
# independent of the real check-appointments workflow. No time window, no Playwright, no
# email — just a timestamp, so it's fast and free to watch fire (or not).
# Safe to delete once the real schedule is confirmed working.

on:
  schedule:
    - cron: "*/5 * * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "schedule fired at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
