name: Check appointments

# The schedule (every 2 minutes, 06:00-23:00 Berlin) is enforced by the external cron service (cron-job.org),
# which calls the workflow_dispatch API. GitHub itself runs every dispatch it receives.
on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "Only send a test email (checks email credentials + recipients), skip the site check"
        type: boolean
        default: false

permissions:
  contents: write # to commit status.json back

# Runs take ~1 min (longer if the site is slow), so dispatches can occasionally overlap. Only one run at a time; a newer pending
# dispatch replaces an older pending one, but a running check is never cancelled.
concurrency:
  group: check-appointments
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Official Playwright image: Python, Chromium and its system libraries are preinstalled, so runs
    # don't depend on Ubuntu's (sometimes very slow) package mirrors.
    # Keep the tag in sync with the playwright version pinned in requirements.txt.
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --ipc=host # recommended for Chromium in Docker
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - run: pip install -r requirements.txt

      - name: Run check
        env:
          # Email backend: Gmail SMTP if GMAIL_APP_PASSWORD is set, otherwise Resend.
          GMAIL_USER: ${{ secrets.GMAIL_USER || vars.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Works whether you stored the addresses as secrets or as repo variables.
          NOTIFY_EMAIL_1: ${{ secrets.NOTIFY_EMAIL_1 || vars.NOTIFY_EMAIL_1 }}
          NOTIFY_EMAIL_2: ${{ secrets.NOTIFY_EMAIL_2 || vars.NOTIFY_EMAIL_2 }}
          NOTIFY_FROM: ${{ vars.NOTIFY_FROM }} # optional, defaults to Resend's sandbox sender
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python scripts/check_appointments.py --test-email
          else
            python scripts/check_appointments.py
          fi

      - name: Upload result screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-screenshot-run${{ github.run_number }}
          path: |
            screenshots/*-result.png
            screenshots/*-error.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit status.json
        if: always()
        run: |
          # Inside the container the checkout is owned by another user; tell git to trust it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -f status.json ] && ! git diff --quiet -- status.json || [ -n "$(git ls-files --others --exclude-standard status.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add status.json
            git commit -m "chore: update status.json"
            git pull --rebase --autostash
            git push
          fi
